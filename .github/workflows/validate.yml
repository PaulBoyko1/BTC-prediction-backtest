name: Validate BTC Lab

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run deterministic backtest smoke tests
        run: npm test
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f README.md
          test -f QUESTIONS.txt
          test -f API_NOTES.md
          test -f DATA_SCHEMA.md
          test -f scripts/ingest.mjs
